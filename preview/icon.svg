<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85"/>
  
  <!-- Stationery Icon Motif: Open Ledger & Fountain Pen -->
  <g transform="translate(256, 230)">
    <!-- Book Left Page -->
    <path d="M -150,90 Q -80,60 0,75 L 0,-70 Q -80,-85 -150,-55 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Book Right Page -->
    <path d="M 150,90 Q 80,60 0,75 L 0,-70 Q 80,-85 150,-55 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    
    <!-- Ledger Rules / Lines -->
    <path d="M -125,-25 Q -75,-45 -20,-35" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M -125,5 Q -75,-15 -20,-5" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M -125,35 Q -75,15 -20,25" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M 20,-35 Q 75,-45 125,-25" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M 20,-5 Q 75,-15 125,5" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M 20,25 Q 75,15 125,35" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

    <!-- Central Spine Bookmark -->
    <path d="M -6,-70 L 6,-70 L 6,105 L 0,95 L -6,105 Z" fill="#ef4444"/>
    
    <!-- Golden Pen floating above -->
    <g transform="translate(0, -95) rotate(-35)">
      <polygon points="-8,-40 8,-40 10,25 0,45 -10,25" fill="url(#goldGrad)"/>
      <circle cx="0" cy="22" r="3" fill="#1e293b"/>
      <line x1="0" y1="22" x2="0" y2="44" stroke="#1e293b" stroke-width="2"/>
    </g>
  </g>

  <!-- Typography Brand Badge -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">GSH APP</text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="19" fill="#f59e0b" letter-spacing="2">GOPESHWAR STATIONARY</text>
</svg>
