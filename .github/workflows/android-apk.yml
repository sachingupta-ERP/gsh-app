name: Android APK

# Manual trigger + on push to main. Change the branch below if your default
# branch isn't main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # The lockfile is committed, so CI uses npm ci for reproducible installs.
      - name: Install dependencies
        run: npm ci

      # Generates Prisma's TypeScript types from prisma/schema.prisma. Needed
      # before typecheck can resolve `@prisma/client` imports. Does not need
      # DATABASE_URL — that's only required to actually connect to a database.
      - name: Generate Prisma client types
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # Builds dist/index.html from the current app (see scripts/build-web.mjs
      # for why this isn't a bundler step yet).
      - name: Build web app
        env:
          OTA_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/manifest.json
          OTA_ENABLED: 'true'
        run: npm run build

      # android/ is gitignored (see .gitignore) and regenerated fresh here from
      # capacitor.config.ts + dist/, then synced with the built web assets.
      - name: Generate Capacitor Android project
        run: npx cap add android

      # @capgo/capacitor-updater requires Android SDK 35. Capacitor 6's
      # generated template currently defaults to SDK 34, so update the
      # generated values before Gradle resolves plugin dependencies.
      - name: Configure Android SDK 35
        run: |
          sed -i "s/compileSdkVersion = 34/compileSdkVersion = 35/" android/variables.gradle
          sed -i "s/targetSdkVersion = 34/targetSdkVersion = 35/" android/variables.gradle

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found under android/app/build/outputs/apk/debug" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gsh-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
